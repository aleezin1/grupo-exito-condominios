<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMaxYMid slice" role="img" aria-label="Fundo decorativo com envelope e balão de conversa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#1d4e89"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c95d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="w" width="22" height="30" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="10" height="14" rx="1.5" fill="#f4c95d" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <circle cx="1360" cy="205" r="230" fill="url(#glow)"/>

  <!-- Prédios ao fundo -->
  <g>
    <rect x="880" y="260" width="96" height="140" fill="#fff" opacity=".07"/>
    <rect x="888" y="268" width="80" height="130" fill="url(#w)"/>
    <rect x="990" y="170" width="112" height="230" fill="#fff" opacity=".09"/>
    <rect x="998" y="178" width="96" height="220" fill="url(#w)"/>
    <rect x="1116" y="230" width="96" height="170" fill="#fff" opacity=".07"/>
    <rect x="1124" y="238" width="80" height="160" fill="url(#w)"/>
    <rect x="1500" y="140" width="100" height="260" fill="#fff" opacity=".09"/>
    <rect x="1508" y="148" width="84" height="250" fill="url(#w)"/>
  </g>

  <!-- Envelope -->
  <rect x="1300" y="178" width="120" height="78" rx="9" fill="#ffffff"/>
  <polyline points="1300,187 1360,226 1420,187" fill="none" stroke="#0b2545" stroke-width="4" stroke-linejoin="round"/>

  <!-- Balão de conversa -->
  <rect x="1382" y="128" width="80" height="50" rx="15" fill="#f4c95d"/>
  <polygon points="1398,176 1398,198 1418,176" fill="#f4c95d"/>
  <circle cx="1404" cy="153" r="5.5" fill="#0b2545"/>
  <circle cx="1422" cy="153" r="5.5" fill="#0b2545"/>
  <circle cx="1440" cy="153" r="5.5" fill="#0b2545"/>
</svg>
